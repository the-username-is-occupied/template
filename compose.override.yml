# compose.override.yml — Development overrides (auto-merged by docker compose up)

services:
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      target: dev
    ports:
      - "80:80"
      - "2019:2019"
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      CADDY_ADMIN: 0.0.0.0:2019
    volumes:
      - .:/var/www/html
      - ./docker/supervisor/common.conf:/etc/supervisor/common.conf
      - ./docker/supervisor/dev.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./docker/app/php.ini:/usr/local/etc/php/php.ini
      - ./Caddyfile:/etc/caddy/Caddyfile

  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  youtube:
    volumes:
      - ./docker/youtube/app:/app/app
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
