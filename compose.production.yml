# compose.production.yml — Production hardening
# Usage: docker compose -f compose.yml -f compose.production.yml up -d
# NOTE: No ports exposed on infrastructure services (db, redis). They communicate
# via Docker network only. Only the app exposes port 80 to the host.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  app:
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    ports:
      - "80:80"
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/log/supervisor:noexec,nosuid,size=50m
    volumes:
      - app_storage:/var/www/html/storage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 200
        reservations:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

  db:
    <<: *default-security
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /run/postgresql:noexec,nosuid,size=10m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

  redis:
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging

volumes:
  app_storage:

networks:
  backend:
    internal: true
