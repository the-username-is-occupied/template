# compose.yml — Base configuration (shared between dev and prod)
# Dev: docker compose up (auto-merges compose.override.yml)
# Prod: docker compose -f compose.yml -f compose.production.yml up -d

name: ${COMPOSE_PROJECT_NAME}

services:
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      target: prod
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - backend

  freellmapi:
    build:
      context: ./docker/freellmapi
      dockerfile: Dockerfile
      args:
        FREELLMAPI_REF: ${FREELLMAPI_REF:-main}
    environment:
      PORT: "3001"
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:-}
    volumes:
      - freellmapi_data:/app/server/data
    ports:
      - "${FREELLMAPI_PORT:-3001}:3001"
    restart: unless-stopped
    networks:
      - frontend
      - backend

  hipporag-api:
    build: ./hipporag-api
    container_name: hipporag-api
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HIPPORAG_LLM_API_KEY=${HIPPORAG_LLM_API_KEY:-${FREELLMAPI_API_KEY:-${OPENAI_API_KEY:-}}}
      - HF_HOME=/app/data/huggingface
    volumes:
      - ./hipporag-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  freellmapi_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
