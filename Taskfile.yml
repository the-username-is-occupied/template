# --- Taskfile for Laravel + FrankenPHP ---
# Usage: task [target]
# Install: https://taskfile.dev/installation/

version: '3'

output: prefixed

dotenv: ['.env']

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  COMPOSE: docker compose
  COMPOSE_PROD: docker compose -f compose.yml -f compose.production.yml
  EXEC: docker compose exec app
  ARTISAN: docker compose exec app php artisan

tasks:
  # === Development ===

  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Start dev environment (foreground with logs)
    cmds:
      - '{{.COMPOSE}} up'

  up:
    desc: Start containers in background
    cmds:
      - '{{.COMPOSE}} up -d --remove-orphans'

  build:
    desc: Build and start containers
    cmds:
      - '{{.COMPOSE}} up -d --build'

  restart:
    desc: Restart all containers
    cmds:
      - '{{.COMPOSE}} restart'

  stop:
    desc: Stop all containers
    cmds:
      - '{{.COMPOSE}} stop'

  down:
    desc: Stop and remove containers and volumes
    cmds:
      - '{{.COMPOSE}} down -v'

  logs:
    desc: Tail container logs
    cmds:
      - '{{.COMPOSE}} logs -f --tail=100'

  ps:
    desc: Show running containers
    cmds:
      - '{{.COMPOSE}} ps'

  infra:
    desc: Start only infrastructure (db, redis)
    cmds:
      - '{{.COMPOSE}} up -d db redis'

  # === Application ===

  shell:
    desc: Open bash inside the app container
    interactive: true
    cmds:
      - '{{.EXEC}} /bin/bash'

  composer-install:
    desc: Install PHP dependencies
    cmds:
      - '{{.EXEC}} composer install --no-interaction --prefer-dist --no-progress'

  npm-install:
    desc: Install Node dependencies
    cmds:
      - '{{.EXEC}} npm ci'

  key-generate:
    desc: Generate APP_KEY
    cmds:
      - '{{.ARTISAN}} key:generate'

  storage-link:
    desc: Create storage symlink
    cmds:
      - '{{.ARTISAN}} storage:link'

  cache-clear:
    desc: Clear all application caches
    cmds:
      - '{{.ARTISAN}} cache:clear'

  optimize:
    desc: Cache config/routes/views (prod)
    cmds:
      - '{{.ARTISAN}} optimize'

  optimize-clear:
    desc: Clear cached config/routes/views
    cmds:
      - '{{.ARTISAN}} optimize:clear'

  # === Database ===

  migrate:
    desc: Run database migrations
    cmds:
      - '{{.ARTISAN}} migrate'

  migrate-fresh:
    desc: Drop all tables and re-run migrations
    cmds:
      - '{{.ARTISAN}} migrate:fresh'

  seed:
    desc: Run database seeders
    cmds:
      - '{{.ARTISAN}} db:seed'

  db-setup:
    desc: Migrate + seed
    cmds:
      - task: migrate
      - task: seed

  db-fresh:
    desc: Fresh migrate + seed
    cmds:
      - task: migrate-fresh
      - task: seed

  # === Quality / CI ===

  fmt:
    desc: Fix code style (Pint)
    cmds:
      - '{{.EXEC}} vendor/bin/pint --config ./pint.json'

  lint:
    desc: Check code style without fixing (Pint)
    cmds:
      - '{{.EXEC}} vendor/bin/pint --test --config ./pint.json'

  rector:
    desc: Run Rector refactoring
    cmds:
      - '{{.EXEC}} vendor/bin/rector process'

  rector-dry:
    desc: Rector dry-run
    cmds:
      - '{{.EXEC}} vendor/bin/rector process --dry-run'

  insights:
    desc: Run PHP Insights
    cmds:
      - '{{.EXEC}} vendor/bin/phpinsights --summary'

  stan:
    desc: Run PHPStan static analysis
    cmds:
      - '{{.EXEC}} vendor/bin/phpstan analyse -c ./phpstan.neon'

  test:
    desc: Run tests in parallel
    cmds:
      - '{{.ARTISAN}} test --env=testing --parallel'

  check:
    desc: Run all quality checks
    cmds:
      - task: lint
      - task: rector-dry
      - task: stan
      - task: test
      - task: insights

  ci:
    desc: Full CI pipeline
    cmds:
      - task: composer-install
      - task: lint
      - task: rector-dry
      - task: stan
      - task: test

  # === Docker — Production ===

  prod-build:
    desc: Build production image
    cmds:
      - '{{.COMPOSE_PROD}} build'

  prod-up:
    desc: Start production environment
    cmds:
      - '{{.COMPOSE_PROD}} up -d'

  prod-down:
    desc: Stop production environment
    cmds:
      - '{{.COMPOSE_PROD}} down'

  prod-logs:
    desc: Tail production logs
    cmds:
      - '{{.COMPOSE_PROD}} logs -f --tail=100'

  prod-ps:
    desc: Show production containers
    cmds:
      - '{{.COMPOSE_PROD}} ps'

  # === Deploy (uses deploy/scripts/) ===

  deploy:
    desc: Run production deployment
    cmds:
      - ./deploy/scripts/deploy.sh

  deploy-update:
    desc: Run zero-downtime update
    cmds:
      - ./deploy/scripts/update.sh

  deploy-rollback:
    desc: Rollback to previous version
    cmds:
      - ./deploy/scripts/rollback.sh

  deploy-health:
    desc: Run production health check
    cmds:
      - ./deploy/scripts/health-check.sh

  deploy-backup:
    desc: Backup production database
    cmds:
      - ./deploy/scripts/backup.sh

  # === Utilities ===

  tinker:
    desc: Open Laravel Tinker
    interactive: true
    cmds:
      - '{{.ARTISAN}} tinker'

  swagger:
    desc: Generate Swagger/OpenAPI docs
    cmds:
      - '{{.ARTISAN}} l5-swagger:generate'

  horizon:
    desc: Show Horizon status
    cmds:
      - '{{.ARTISAN}} horizon:status'

  # === Composite ===

  init:
    desc: Full project init
    cmds:
      - task: build
      - task: composer-install
      - task: npm-install
      - task: key-generate
      - task: storage-link
      - task: db-setup
      - echo "--- Init complete. Run 'task dev' to start. ---"

  clean:
    desc: Remove generated files and caches
    cmds:
      - rm -rf public/build public/hot coverage/
